<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Markdown Preview</title>

  <link rel="stylesheet" href="css/github-markdown.css">
  <link rel="stylesheet" href="css/katex.min.css">
  <link rel="stylesheet" href="css/github-hljs.min.css">

  <style>
    :root {
      --border-color: #d0d7de;
      --bg-gray: #f6f8fa;
      --sidebar-min: 16%;
      --sidebar-max: 40%;
      --line-height: 20px;
      --gutter-width: 52px;
      --gutter-font: 500 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      --green-btn: #1a7f37;
      --green-btn-hover: #157a30;
      --green-btn-bg: #dafbe1;
      --red-border: #d1242f;
      --red-bg: #ffebe9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      color: #1f2328;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-min);
      min-width: var(--sidebar-min);
      max-width: var(--sidebar-max);
      border-right: 1px solid var(--border-color);
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      user-select: none;
    }

    .sidebar.animating {
      transition: width 0.15s ease, min-width 0.15s ease, max-width 0.15s ease;
    }

    .sidebar.collapsed {
      width: 50px !important;
      min-width: 50px !important;
      max-width: 50px !important;
    }

    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .file-tree,
    .sidebar.collapsed .resize-handle {
      display: none;
    }

    .sidebar.collapsed .sidebar-header {
      padding: 10px 11px;
      justify-content: center;
      border-bottom: none;
    }

    .sidebar.collapsed .drop-overlay {
      display: none !important;
    }

    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-gray);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sidebar-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #57606a;
      padding: 0;
    }

    .icon-btn:hover {
      background: var(--bg-gray);
      color: #1f2328;
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    /* File tree */
    .file-tree {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0;
      font-size: 13px;
    }

    /* Empty state */
    .tree-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: #57606a;
      font-size: 13px;
    }

    .tree-empty-buttons {
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: center;
    }

    .tree-empty-or {
      font-size: 12px;
      color: #8b949e;
      font-weight: 500;
      line-height: 32px;
    }

    .green-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      border: 1px solid var(--green-btn);
      border-radius: 6px;
      background: var(--green-btn-bg);
      color: var(--green-btn);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
      width: 180px;
      height: 36px;
    }

    .green-btn:hover {
      background: #b6e3c4;
    }

    .green-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* Drag overlay */
    .drop-zone {
      position: relative;
    }

    .drop-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      border-radius: 6px;
      pointer-events: none;
    }

    .drop-overlay.visible {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drop-overlay.valid {
      background: rgba(26, 127, 55, 0.08);
      border: 2px dashed var(--green-btn);
    }

    .drop-overlay.valid .drop-text {
      color: var(--green-btn);
    }

    .drop-overlay.invalid {
      background: rgba(209, 36, 47, 0.06);
      border: 2px dashed var(--red-border);
    }

    .drop-overlay.invalid .drop-text {
      color: var(--red-border);
    }

    .drop-text {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    .drop-text span {
      display: block;
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
      opacity: 0.8;
    }

    /* Tree row */
    .tree-row {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding-right: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tree-row:hover {
      background-color: rgba(208, 215, 222, 0.3);
    }

    .tree-row.active {
      background-color: #ddf4ff;
    }

    .tree-row.active .tree-name {
      color: #0969da;
      font-weight: 600;
    }

    .tree-gutter {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
    }

    .tree-gutter-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #d8dee4;
    }

    .tree-indent {
      flex-shrink: 0;
    }

    .tree-chevron {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 2px;
    }

    .tree-chevron svg {
      width: 12px;
      height: 12px;
      fill: #57606a;
      transition: transform 0.12s ease;
    }

    .tree-row.expanded>.tree-chevron svg {
      transform: rotate(90deg);
    }

    .tree-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-right: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tree-icon svg {
      width: 16px;
      height: 16px;
    }

    .tree-name {
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1f2328;
    }

    /* ===== RESIZE HANDLE ===== */
    .resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      bottom: 0;
      width: 7px;
      cursor: col-resize;
      z-index: 10;
    }

    .resize-handle::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      right: 3px;
      width: 1px;
      background-color: transparent;
      transition: background-color 0.15s;
    }

    .resize-handle:hover::after,
    .resize-handle.active::after {
      background-color: #0969da;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-gray);
      padding: 0;
      margin-left: 8px;
      min-width: 0;
    }

    .workspace-box {
      border: 1px solid var(--border-color);
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* ===== TOOLBAR ===== */
    .github-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-gray);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      gap: 8px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-group {
      display: flex;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }

    .toggle-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: #57606a;
      position: relative;
    }

    .toggle-btn:not(:last-child) {
      border-right: 1px solid var(--border-color);
    }

    .toggle-btn.active {
      background-color: #ffffff;
      color: #1f2328;
      font-weight: 600;
    }

    .toggle-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #fd8c73;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #1f2328;
    }

    .action-btn:hover {
      background: var(--bg-gray);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .action-btn.toggled {
      background: #ddf4ff;
      border-color: #0969da;
      color: #0969da;
    }

    /* ===== VIEW PANES ===== */
    .view-pane {
      flex: 1;
      overflow: hidden;
      display: none;
    }

    .view-pane.active {
      display: flex;
      flex-direction: column;
    }

    .view-pane.active#pane-preview {
      display: block;
      overflow: auto;
    }

    .markdown-body {
      padding: 32px 64px;
      background-color: #ffffff;
    }

    /* ===== CODE EDITOR WITH GUTTER ===== */
    .editor-wrap {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .gutter {
      width: var(--gutter-width);
      min-width: var(--gutter-width);
      background: #f6f8fa;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    .gutter-inner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
    }

    .gutter-row {
      padding: 0 12px 0 0;
      text-align: right;
      font: var(--gutter-font);
      color: #57606a;
      white-space: nowrap;
      overflow: hidden;
    }

    #markdown-input {
      flex: 1;
      border: none;
      padding: 0 16px;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: var(--line-height);
      outline: none;
      background: #ffffff;
      color: #1f2328;
      tab-size: 4;
      -moz-tab-size: 4;
      white-space: pre;
      overflow: auto;
    }

    #markdown-input.wrap-on {
      white-space: pre-wrap;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    /* ===== FRONT MATTER STYLES ===== */
    .fm-null,
    .fm-empty-arr,
    .fm-empty-obj {
      opacity: 0.45;
      font-style: italic;
    }

    markdown-accessiblity-table {
      display: block;
      width: 100%;
      margin-bottom: 24px;
    }

    markdown-accessiblity-table table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 !important;
    }

    markdown-accessiblity-table code {
      background-color: rgba(175, 184, 193, 0.2);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 85%;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    markdown-accessiblity-table a {
      color: #0969da;
      text-decoration: none;
    }

    markdown-accessiblity-table a:hover {
      text-decoration: underline;
    }

    markdown-accessiblity-table div[dir="auto"] {
      padding: 2px 0;
    }

    /* ===== CONTEXT MENU ===== */
    .ctx-menu {
      display: none;
      position: fixed;
      z-index: 9999;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 4px 0;
      min-width: 220px;
      font-size: 13px;
    }

    .ctx-menu.visible {
      display: block;
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      cursor: pointer;
      color: #1f2328;
      white-space: nowrap;
    }

    .ctx-item:hover {
      background: rgba(208, 215, 222, 0.4);
    }

    .ctx-item svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: #57606a;
    }

    .ctx-sep {
      height: 1px;
      background: var(--border-color);
      margin: 4px 0;
    }

    .ctx-item.danger {
      color: #d1242f;
    }

    .ctx-item.danger svg {
      color: #d1242f;
    }

    .ctx-item.danger:hover {
      background: var(--red-bg);
    }

    #folder-picker {
      display: none;
    }

    #file-picker {
      display: none;
    }

    /* Thiết lập cho khối hộp bao bọc tổng thể bên ngoài */
    div[style*="position: relative"] {
      position: relative !important;
      margin: 16px 0 !important;
    }

    /* Định dạng cấu trúc cho khung hiển thị code block bên trong */
    div[style*="position: relative"] pre {
      margin: 0 !important;
      padding: 16px !important;
      background-color: #f6f8fa !important;
      border-radius: 6px !important;
      overflow-x: auto !important;
    }

    /* Định dạng cấu trúc cho chữ bên trong thẻ code */
    div[style*="position: relative"] code {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace !important;
      font-size: 13.6px !important;
      line-height: 1.5 !important;
    }

    /* Cố định nút bấm ép nó ghim vào góc bên phải phía trên */
    .ClipboardButton {
      position: absolute !important;
      top: 8px !important;
      right: 8px !important;
      z-index: 10 !important;
      width: 28px !important;
      height: 28px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #57606a !important;
      background-color: transparent !important;
      /* Đổi thành trong suốt để tiệp vào nền */
      border: none !important;
      /* XÓA BỎ HOÀN TOÀN ĐƯỜNG VIỀN */
      border-radius: 6px !important;
      /* BO GÓC NHẸ 6PX CHUẨN GITHUB */
      cursor: pointer !important;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* Hiệu ứng đổi màu nền khi di chuột qua nút */
    .ClipboardButton:hover {
      background-color: #eaeef2 !important;
      color: #24292f !important;
    }

    /* Ép các biểu tượng SVG luôn tuân thủ đúng tỷ lệ hiển thị */
    .ClipboardButton svg {
      width: 16px !important;
      height: 16px !important;
      fill: currentColor !important;
    }

    /* Lớp quản lý trạng thái ẩn phần tử */
    .d-none {
      display: none !important;
    }

    /* Thiết lập màu xanh lá cho icon check thành công */
    .js-clipboard-check-icon {
      color: #1a7f37 !important;
    }


    /* =========================================
    ANCHOR
    ========================================= */

    /* Khung chứa tiêu đề bắt buộc phải có thuộc tính này làm mốc tọa độ */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      position: relative;
      /* Tạo khoảng trống lề trái cho toàn bộ nội dung tiêu đề nếu bạn muốn tiêu đề thẳng hàng với text dưới */
      /* padding-left: 24px; (Bật dòng này nếu muốn chữ tiêu đề thụt vào một chút chừa chỗ cho dấu #) */
    }

    /* Định dạng cấu trúc cho biểu tượng dấu # mọc ra lề ngoài */
    .markdown-anchor {
      position: absolute !important;
      /* Ép buộc tách dấu # ra khỏi luồng văn bản thông thường */
      left: -30px;
      /* Đẩy dấu # bay ra ngoài vùng lề bên trái tiêu đề 20px */
      top: 50%;
      /* Căn giữa dấu # theo chiều dọc dòng tiêu đề */
      transform: translateY(-50%);
      /* Hoàn tất căn giữa chiều dọc */

      color: #0969da !important;
      /* Màu xanh link chuẩn GitHub */
      text-decoration: none;
      opacity: 0;
      /* Mặc định ẩn hoàn toàn */
      transition: opacity 0.15s ease-in-out;
    }

    /* Hiển thị mượt mà dấu # ra lề trái khi di chuột vào dòng tiêu đề */
    h1:hover .markdown-anchor,
    h2:hover .markdown-anchor,
    h3:hover .markdown-anchor,
    h4:hover .markdown-anchor,
    h5:hover .markdown-anchor,
    h6:hover .markdown-anchor {
      opacity: 1;
    }

    /* Hiệu ứng mờ nhẹ khi di chuột trực tiếp vào chính dấu # */
    .markdown-anchor:hover {
      color: #0550ae !important;
    }



    /* ========================================
    TOC PLUGIN
    ======================================== */
    /* Khung bao bọc tổng thể của hộp Mục lục */
    .table-of-contents {
      background-color: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px 24px;
      margin-bottom: 24px;
      /* max-width: 400px; */
      /* Giới hạn chiều ngang hộp mục lục */
    }

    /* Tiêu đề tự động sinh ra phía trên mục lục (chữ "Contents") */
    .table-of-contents::before {
      content: "📋 Mục lục bài viết";
      display: block;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 8px;
      color: #24292f;
    }

    /* Cấu trúc cây thư mục danh sách */
    .toc-list {
      padding-left: 16px;
      margin: 0;
      list-style-type: disc;
    }

    /* Các mục con lồng nhau (ví dụ h2 lồng trong h1) */
    .toc-list .toc-list {
      list-style-type: circle;
      margin-top: 4px;
    }

    .toc-item {
      margin-top: 4px;
    }

    /* Định dạng đường dẫn liên kết chữ */
    .toc-link {
      color: #0969da !important;
      text-decoration: none;
      font-size: 14px;
    }

    /* Hiệu ứng gạch chân khi người dùng di chuột qua mục lục */
    .toc-link:hover {
      text-decoration: underline !important;
    }



    /* ========================================
    Highlight mark
    ======================================== */

    /* Định dạng cho thẻ mark (chữ highlight nền vàng) */
    .markdown-body mark {
      background-color: #fff5b1 !important;
      /* Màu vàng dạ quang sáng dịu kiểu GitHub/Notion */
      color: #24292f !important;
      /* Màu chữ xám sẫm để dễ đọc */
      padding: 0.2em 0.3em !important;
      /* Tạo khoảng cách lề nhỏ xung quanh chữ */
      border-radius: 2px !important;
      /* Bo góc nhẹ 3px */
    }



    /* ========================================
    Container box
    ======================================== */
    /* 1. GOM NHÓM CHUNG - Điều chỉnh lề (padding/margin) vừa phải, gọn gàng */
    .info,
    .success,
    .warning,
    .danger,
    .note,
    .important {
      padding: 12px 16px !important;
      /* Giảm padding dọc xuống 12px cho thanh thoát */
      margin: 12px 0 !important;
      /* Giảm khoảng cách giữa các khối hộp xuống 12px */
      border-left: 2px solid !important;
      border-radius: 4px !important;
    }

    /* 2. CHỈNH SỬA THẺ TIÊU ĐỀ H3 BÊN TRONG HỘP - Thu nhỏ chữ và gỡ lề thừa */
    .info h3,
    .success h3,
    .warning h3,
    .danger h3,
    .note h3,
    .important h3 {
      font-size: 14px !important;
      /* Thu nhỏ chữ tiêu đề xuống bằng cỡ chữ văn bản (14px) */
      font-weight: 600 !important;
      /* Giữ chữ đậm vừa phải */
      margin-top: 0 !important;
      /* Xóa bỏ lề trên để không bị đẩy trống */
      margin-bottom: 6px !important;
      /* Lề dưới vừa phải để ngăn cách với đoạn văn */
      line-height: 1.4 !important;
      display: flex;
      align-items: center;
    }

    /* 3. ĐOẠN VĂN P BÊN TRONG HỘP - Giảm cỡ chữ và xóa lề đáy */
    .info p,
    .success p,
    .warning p,
    .danger p,
    .note p,
    .important p {
      font-size: 13.5px !important;
      /* Chữ nội dung nhỏ nhắn dễ đọc */
      margin: 0 !important;
      /* Xóa bỏ margin mặc định của thẻ p để hộp gọn nhất */
      line-height: 1.5 !important;
    }

    /* --- BẢNG PHÂN PHỐI MÀU SẮC (GIỮ NGUYÊN BẢNG MÀU CHUẨN) --- */
    .info {
      background-color: #ddf4ff !important;
      border-left-color: #0969da !important;
      color: #1f2328 !important;
    }

    .success {
      background-color: #dafbe1 !important;
      border-left-color: #1a7f37 !important;
      color: #1f2328 !important;
    }

    .warning {
      background-color: #fff8ec !important;
      border-left-color: #bf8700 !important;
      color: #1f2328 !important;
    }

    .danger {
      background-color: #ffebe9 !important;
      border-left-color: #cf222e !important;
      color: #1f2328 !important;
    }

    .note {
      background-color: #f6f8fa !important;
      border-left-color: #d0d7de !important;
      color: #1f2328 !important;
    }

    .important {
      background-color: #f5e8ff !important;
      border-left-color: #8250df !important;
      color: #1f2328 !important;
    }


    /* ==============================
    Abbreviation
    ============================== */
    abbr[title] {
      /* Gạch chân chấm nhỏ màu xanh */
      text-decoration: underline dotted #007bff;
      /* Đổi con trỏ chuột thành hình dấu chấm hỏi (?) khi di vào */
      cursor: help;
    }


    /* ==============================
    Deflist
    ============================== */
    /* 1. Khung bọc tổng thể */
    dl {
      margin: 30px 0;
      padding: 0;
    }

    /* 2. Ép cặp thuật ngữ & định nghĩa dính liền nhau thành 1 hàng */
    dt,
    dd {
      display: block;
    }

    /* 3. Khối thuật ngữ (Nằm trên, căn trái, chữ đậm) */
    dt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #1e293b;
      margin: 24px 0 6px 0;
      /* Khoảng cách với khối trên và khối dưới */
      padding: 0;
      display: flex;
      align-items: center;
    }

    /* Vạch màu xanh bám sát chữ, không chạy lung tung */
    dt::before {
      content: "";
      display: inline-block;
      width: 2px;
      height: 32px;
      background-color: #3b82f6;
      /* Xanh Modern Blue */
      margin-right: 8px;
    }

    /* 4. Khối nội dung định nghĩa (Thụt lề nhẹ, font dịu mắt) */
    dd {
      margin: 0 0 12px 12px;
      /* Thụt lề trái 12px để tạo phân cấp, không bị thô */
      padding: 0;
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Nếu có nhiều dòng định nghĩa cho cùng một thuật ngữ */
    dd+dd {
      margin-top: 6px;
      /* Khoảng cách hẹp giữa các dòng định nghĩa cùng nhóm */
    }
  </style>

      /* ====================================================================
         1. VIRTUALIZED LINE NUMBERS (langdiff logic)
            Always 1 gutter row per logical \n line.
            Wrap mode: each gutter row height matches visual line height.
      ==================================================================== */
      var gutterPool = [];
      var gutterScheduled = false;

      var _measuredLH = null;
      function getActualLineHeight() {
        if (_measuredLH !== null) return _measuredLH;
        var t = document.createElement('textarea');
        t.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;'
          + 'font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;'
          + 'font-size:14px;line-height:20px;padding:0 16px;white-space:pre;'
          + 'resize:none;border:none;overflow:hidden;width:100px;';
        t.value = 'X\nX\nX';
        document.body.appendChild(t);
        _measuredLH = Math.round(t.scrollHeight / 3);
        document.body.removeChild(t);
        LINE_HEIGHT = _measuredLH;
        return _measuredLH;
      }
      getActualLineHeight();

      var lineMeasureDiv = null;
      var _lastWrapWidth = 0;
      var _lastWrapVal = '';
      var _cachedWrapHeights = null;

      function ensureLineMeasureDiv() {
        if (lineMeasureDiv) return;
        lineMeasureDiv = document.createElement('div');
        lineMeasureDiv.setAttribute('aria-hidden', 'true');
        lineMeasureDiv.style.cssText =
          'position:fixed;visibility:hidden;pointer-events:none;'
          + 'font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;'
          + 'font-size:14px;line-height:' + LINE_HEIGHT + 'px;'
          + 'white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word;'
          + 'padding:0 16px;overflow:hidden;top:-9999px;left:-9999px;';
        document.body.appendChild(lineMeasureDiv);
      }

      function measureWrapLineHeights() {
        var val = input.value;
        var w = input.clientWidth;
        if (!w) return null;
        if (val === _lastWrapVal && w === _lastWrapWidth && _cachedWrapHeights) {
          return _cachedWrapHeights;
        }
        _lastWrapVal = val;
        _lastWrapWidth = w;
        var lines = val.split('\n');
        if (!lines.length) { _cachedWrapHeights = null; return null; }
        ensureLineMeasureDiv();
        lineMeasureDiv.style.width = w + 'px';
        lineMeasureDiv.innerHTML = '';
        var divs = [];
        for (var i = 0; i < lines.length; i++) {
          var d = document.createElement('div');
          d.textContent = lines[i] || '\u200B';
          lineMeasureDiv.appendChild(d);
          divs.push(d);
        }
        var heights = new Array(lines.length);
        for (var i = 0; i < divs.length; i++) {
          heights[i] = divs[i].offsetHeight;
        }
        _cachedWrapHeights = heights;
        return heights;
      }

      function getOrCreateGutterRow(idx) {
        if (!gutterPool[idx]) {
          var el = document.createElement('div');
          el.className = 'gutter-row';
          el.style.height = LINE_HEIGHT + 'px';
          el.style.lineHeight = LINE_HEIGHT + 'px';
          gutterPool[idx] = el;
        }
        return gutterPool[idx];
      }

      function totalLines() {
        var val = input.value;
        if (!val) return 1;
        var count = 1;
        for (var i = 0; i < val.length; i++) {
          if (val.charCodeAt(i) === 10) count++;
        }
        return count;
      }

      function renderGutter() {
        gutterScheduled = false;
        var scrollTop = input.scrollTop;
        var clientH = input.clientHeight;
        var total = totalLines();
        if (clientH <= 0) return;

        var wrapHeights = wordWrap ? measureWrapLineHeights() : null;
        var cumTops = null;

        var start, end;
        if (wrapHeights) {
          cumTops = [0];
          for (var k = 1; k < total; k++) cumTops[k] = cumTops[k - 1] + wrapHeights[k - 1];
          start = 0; end = total - 1;
          for (var i = 0; i < total; i++) {
            if (cumTops[i] + wrapHeights[i] > scrollTop) { start = Math.max(0, i - GUTTER_BUFFER); break; }
          }
          for (var j = total - 1; j >= 0; j--) {
            if (cumTops[j] < scrollTop + clientH) { end = Math.min(total - 1, j + GUTTER_BUFFER); break; }
          }
        } else {
          var firstVisible = Math.max(0, Math.floor(scrollTop / LINE_HEIGHT));
          var lastVisible = Math.ceil((scrollTop + clientH) / LINE_HEIGHT);
          start = Math.max(0, firstVisible - GUTTER_BUFFER);
          end = Math.min(total - 1, lastVisible + GUTTER_BUFFER);
        }

        var frag = document.createDocumentFragment();
        for (var i = start; i <= end; i++) {
          var row = getOrCreateGutterRow(i - start);
          row.textContent = String(i + 1);
          if (wrapHeights) {
            var h = wrapHeights[i] || LINE_HEIGHT;
            row.style.height = h + 'px';
            row.style.lineHeight = h + 'px';
          } else {
            row.style.height = LINE_HEIGHT + 'px';
            row.style.lineHeight = LINE_HEIGHT + 'px';
          }
          frag.appendChild(row);
        }
        gutterInner.replaceChildren(frag);

        if (cumTops) {
          gutterInner.style.transform = 'translateY(' + (cumTops[start] - scrollTop) + 'px)';
        } else {
          gutterInner.style.transform = 'translateY(' + (start * LINE_HEIGHT - scrollTop) + 'px)';
        }
      }

      function scheduleGutterUpdate() {
        if (gutterScheduled) return;
        gutterScheduled = true;
        requestAnimationFrame(renderGutter);
      }

      input.addEventListener('scroll', function () { scheduleGutterUpdate(); });
      input.addEventListener('input', function () { updatePreview(); scheduleGutterUpdate(); });
      window.addEventListener('resize', function () { _cachedWrapHeights = null; _lastWrapVal = ''; scheduleGutterUpdate(); });

      /* ====================================================================
         2. WORD WRAP TOGGLE
      ==================================================================== */
      btnWrap.addEventListener('click', function () {
        wordWrap = !wordWrap;
        input.classList.toggle('wrap-on', wordWrap);
        btnWrap.classList.toggle('toggled', wordWrap);
        _cachedWrapHeights = null;
        _lastWrapVal = '';
        scheduleGutterUpdate();
      });

      /* ====================================================================
         3. TAB KEY = 4 SPACES
      ==================================================================== */
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          var start = input.selectionStart;
          var end = input.selectionEnd;
          var val = input.value;

          if (e.shiftKey) {
            var beforeSel = val.substring(0, start);
            var afterSel = val.substring(end);
            var lineStart = beforeSel.lastIndexOf('\n') + 1;
            var fullSel = val.substring(lineStart, end);
            var lines = fullSel.split('\n');
            var newLines = lines.map(function (line) {
              if (line.startsWith('    ')) return line.substring(4);
              if (line.startsWith('   ')) return line.substring(3);
              if (line.startsWith('  ')) return line.substring(2);
              if (line.startsWith(' ')) return line.substring(1);
              return line;
            });
            var newText = newLines.join('\n');
            input.value = val.substring(0, lineStart) + newText + afterSel;
            input.selectionStart = lineStart;
            input.selectionEnd = lineStart + newText.length;
          } else {
            input.value = val.substring(0, start) + '    ' + val.substring(end);
            input.selectionStart = input.selectionEnd = start + 4;
          }
          updatePreview();
          scheduleGutterUpdate();
        }
      });

      /* ====================================================================

      ==================================================================== */
      var isResizing = false;
      var resizeRafId = null;

      resizeHandle.addEventListener('mousedown', function (e) {
        isResizing = true;
        resizeHandle.classList.add('active');

      document.addEventListener('mousemove', function (e) {

        if (resizeRafId) return;
        resizeRafId = requestAnimationFrame(function () {
          resizeRafId = null;
          var totalW = window.innerWidth;
          var pct = (e.clientX / totalW) * 100;
          pct = Math.max(16, Math.min(40, pct));
          sidebar.style.width = pct + '%';
          sidebar.style.minWidth = pct + '%';
          sidebar.style.maxWidth = pct + '%';
        });
      });

      document.addEventListener('mouseup', function () {
        if (!isResizing) return;
        isResizing = false;
        if (resizeRafId) { cancelAnimationFrame(resizeRafId); resizeRafId = null; }
        resizeHandle.classList.remove('active');
        sidebar.classList.add('animating');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      });

      /* ====================================================================
         5. DRAG & DROP (sidebar, .md/.txt only)
      ==================================================================== */
      var dragCounter = 0;

      sidebar.addEventListener('dragenter', function (e) {
        e.preventDefault(); e.stopPropagation();
        dragCounter++;
        var items = e.dataTransfer.items;
        var valid = true;
        if (items && items.length) {
          for (var i = 0; i < items.length; i++) {
            if (items[i].kind === 'file') {
              var ext = (items[i].name || '').split('.').pop().toLowerCase();
              if (ext !== 'md' && ext !== 'txt') { valid = false; break; }
            }
          }
        }
        dropOverlay.className = 'drop-overlay visible ' + (valid ? 'valid' : 'invalid');
        dropText.innerHTML = valid
          ? 'Drop here to load file/folder<span>.md and .txt only</span>'
          : 'Only .md and .txt files are supported';
      });

      sidebar.addEventListener('dragover', function (e) { e.preventDefault(); e.stopPropagation(); });

      sidebar.addEventListener('dragleave', function (e) {
        e.preventDefault(); e.stopPropagation();
        dragCounter--;
        if (dragCounter <= 0) { dragCounter = 0; dropOverlay.className = 'drop-overlay'; }
      });

      sidebar.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        dragCounter = 0;
        dropOverlay.className = 'drop-overlay';
        var files = e.dataTransfer.files;
        if (!files.length) return;
        var allValid = true;
        for (var i = 0; i < files.length; i++) {
          var ext = files[i].name.split('.').pop().toLowerCase();
          if (ext !== 'md' && ext !== 'txt') { allValid = false; break; }
        }
        if (!allValid) {
          dropOverlay.className = 'drop-overlay visible invalid';
          dropText.innerHTML = 'Only .md and .txt files are supported';
          setTimeout(function () { dropOverlay.className = 'drop-overlay'; }, 1500);
          return;
        }
        loadFiles(files);
      });

      /* ====================================================================
         6. SIDEBAR COLLAPSE / EXPAND & FILE / FOLDER PICKERS
      ==================================================================== */
      var sidebarCollapsed = false;
      var prevSidebarWidth = null;

      btnToggleSidebar.addEventListener('click', function () {
        sidebarCollapsed = !sidebarCollapsed;
        if (sidebarCollapsed) {
          prevSidebarWidth = sidebar.style.width || '';
          sidebar.classList.add('collapsed');

        } else {
          sidebar.classList.remove('collapsed');

      btnOpenFile.addEventListener('click', function () { filePicker.click(); });
      btnOpenFolderEmpty.addEventListener('click', function () { folderPicker.click(); });

      filePicker.addEventListener('change', function (e) {
        if (!e.target.files.length) return;
        loadFiles(e.target.files);
      });

      folderPicker.addEventListener('change', function (e) {
        if (!e.target.files.length) return;
        loadFiles(e.target.files, true);
      });

      function loadFiles(files, isFolder) {
        Object.keys(mediaBlobUrls).forEach(function (k) { URL.revokeObjectURL(mediaBlobUrls[k]); });
        mediaBlobUrls = {};
        loadedFiles = {};
        activeTreeRow = null;

        if (isFolder) {
          openMode = 'folder';
          var mediaFiles = [];
          var textFilePromises = [];

          Array.from(files).forEach(function (file) {
            var parts = file.webkitRelativePath.split('/');
            if (parts.some(function (p) { return p === '.git' || p === '.DS_Store' || p === 'node_modules'; })) return;
            if (isMediaFile(file.name)) {
              mediaBlobUrls[file.webkitRelativePath] = URL.createObjectURL(file);
              mediaFiles.push(file);
            } else {
              textFilePromises.push(new Promise(function (resolve) {
                var reader = new FileReader();
                reader.onload = function (evt) { loadedFiles[file.webkitRelativePath] = evt.target.result; resolve(file); };
                reader.onerror = function () { resolve(null); };
                reader.readAsText(file);
              }));
            }
          });

          Promise.all(textFilePromises).then(function (resolved) {
            var validTextFiles = resolved.filter(function (f) { return f !== null; });
            var allForTree = validTextFiles.concat(mediaFiles);
            treeRoot = buildTree(allForTree);
            renderTree(treeRoot);
            treeEmpty.style.display = 'none';
            var allPaths = Object.keys(loadedFiles);
            var readmePath = allPaths.find(function (p) { return p.split('/').pop().toLowerCase() === 'readme.md'; })
              || allPaths.find(function (p) { return p.toLowerCase().endsWith('.md'); });
            if (readmePath) selectFileInTree(readmePath);
            sidebarLabel.textContent = allForTree.length ? allForTree[0].webkitRelativePath.split('/')[0] : 'File tree';
          });
        } else {
          openMode = 'file';
          var promises = Array.from(files).map(function (file) {
            return new Promise(function (resolve) {
              var reader = new FileReader();
              reader.onload = function (evt) { loadedFiles[file.name] = evt.target.result; resolve(file); };
              reader.onerror = function () { resolve(null); };
              reader.readAsText(file);
            });
          });
          Promise.all(promises).then(function (resolved) {
            var validFiles = resolved.filter(function (f) { return f !== null; });
            var fakeFiles = validFiles.map(function (f) {
              return { name: f.name, webkitRelativePath: f.name, isMd: f.name.toLowerCase().endsWith('.md') };
            });
            treeRoot = buildFlatTree(fakeFiles);
            renderTree(treeRoot);
            treeEmpty.style.display = 'none';
            sidebarLabel.textContent = validFiles.length === 1 ? validFiles[0].name : 'Files';
            if (validFiles.length) selectFileInTree(validFiles[0].name);
          });
        }
      }

      function selectFileInTree(path) {
        var name = path.split('/').pop();
        currentFileName = name;
        currentFilePath = path;
        input.value = loadedFiles[path] || '# Unable to read this file.';
        updatePreview();
        scheduleGutterUpdate();
        var row = treeContainer.querySelector('.tree-row[data-path="' + CSS.escape(path) + '"]');
        if (row) {
          if (activeTreeRow) activeTreeRow.classList.remove('active');
          row.classList.add('active');
          activeTreeRow = row;
        }
      }

      /* ====================================================================
         7. COLLAPSIBLE TREE WITH GUTTER LINES
      ==================================================================== */
      function buildTree(files) {
        var root = { name: '', children: {}, isFolder: true, expanded: true, path: '' };
        var sorted = files.sort(function (a, b) { return a.webkitRelativePath.localeCompare(b.webkitRelativePath); });
        sorted.forEach(function (file) {
          var parts = file.webkitRelativePath.split('/');
          var node = root;
          for (var i = 0; i < parts.length; i++) {
            var part = parts[i], isLast = i === parts.length - 1;
            var ext = part.split('.').pop().toLowerCase();
            var isMd = isLast && ext === 'md';
            var isMedia = isLast && isMediaFile(part);
            if (!node.children[part]) {
              node.children[part] = { name: part, children: {}, isFolder: !isLast, expanded: false, path: parts.slice(0, i + 1).join('/'), isMd: isMd, isMedia: isMedia, mediaType: isMedia ? getMediaType(part) : null, fileEntry: isLast ? file : null };
            } else if (isLast) {
              node.children[part].fileEntry = file;
              node.children[part].isMd = isMd;
              node.children[part].isMedia = isMedia;
              node.children[part].mediaType = isMedia ? getMediaType(part) : null;
            }
            node = node.children[part];
          }
        });
        Object.values(root.children).forEach(function (c) { if (c.isFolder) c.expanded = true; });
        return root;
      }

      function buildFlatTree(items) {
        var root = { name: '', children: {}, isFolder: true, expanded: true, path: '' };
        items.forEach(function (item) {
          root.children[item.name] = { name: item.name, children: {}, isFolder: false, expanded: false, path: item.webkitRelativePath || item.name, isMd: item.isMd || item.name.toLowerCase().endsWith('.md'), fileEntry: item };
        });
        return root;
      }

      function sortChildren(node) {
        var entries = Object.entries(node.children);
        entries.sort(function (a, b) {
          if (a[1].isFolder && !b[1].isFolder) return -1;
          if (!a[1].isFolder && b[1].isFolder) return 1;
          return a[0].localeCompare(b[0], undefined, { sensitivity: 'base' });
        });
        return entries;
      }

      function renderTree(rootNode) {
        var oldRows = treeContainer.querySelectorAll('.tree-row');
        oldRows.forEach(function (r) { r.remove(); });
        if (!Object.keys(rootNode.children).length) { treeEmpty.style.display = ''; return; }
        treeEmpty.style.display = 'none';

        function addGutterLines(row, depth) {
          var g = document.createElement('span');
          g.className = 'tree-gutter';
          g.style.left = '0';
          g.style.width = (depth * INDENT_UNIT) + 'px';
          row.appendChild(g);
          for (var d = 1; d <= depth; d++) {
            var line = document.createElement('span');
            line.className = 'tree-gutter-line';
            line.style.left = (d * INDENT_UNIT - 8) + 'px';
            g.appendChild(line);
          }
        }

        function createRow(node, depth) {
          var row = document.createElement('div');
          row.className = 'tree-row' + (node.expanded ? ' expanded' : '');
          row.dataset.path = node.path;

          var indent = document.createElement('span');
          indent.className = 'tree-indent';
          indent.style.width = (depth * INDENT_UNIT) + 'px';
          row.appendChild(indent);

          if (node.isFolder) {
            var chev = document.createElement('span');
            chev.className = 'tree-chevron';
            chev.innerHTML = SVG.chevron;
            row.appendChild(chev);
          } else {
            var sp = document.createElement('span');
            sp.style.width = '18px'; sp.style.flexShrink = '0';
            row.appendChild(sp);
          }

          var icon = document.createElement('span');
          icon.className = 'tree-icon';
          icon.innerHTML = node.isFolder ? (node.expanded ? SVG.folderOpen : SVG.folder) : node.isMedia ? (node.mediaType === 'video' ? SVG.video : (node.mediaType === 'audio' ? SVG.audio : SVG.image)) : (node.isMd ? SVG.fileMd : SVG.file);
          row.appendChild(icon);

          var name = document.createElement('span');
          name.className = 'tree-name';
          name.textContent = node.name;
          row.appendChild(name);

          addGutterLines(row, depth);

          row.addEventListener('click', function (e) {
            e.stopPropagation();
            if (node.isFolder) {
              node.expanded = !node.expanded;
              renderTree(treeRoot);
            } else if (node.isMedia) {
              var url = mediaBlobUrls[node.path];
              if (!url) return;
              var md;
              if (node.mediaType === 'image') {
                md = '![' + node.name + '](' + url + ')';
              } else if (node.mediaType === 'video') {
                md = '<video controls src="' + url + '" style="max-width:100%"></video>';
              } else {
                md = '<audio controls src="' + url + '"></audio>';
              }
              input.value = md;
              updatePreview();
              scheduleGutterUpdate();
            } else {
              if (activeTreeRow) activeTreeRow.classList.remove('active');
              row.classList.add('active');
              activeTreeRow = row;
              currentFileName = node.name;
              currentFilePath = node.path;
              input.value = loadedFiles[node.path] || '# Unable to read this file.';
              updatePreview();
              scheduleGutterUpdate();
            }
          });
          return row;
        }

        function renderNode(node, depth, container) {
          if (node.isFolder && !node.expanded) {
            if (node.name) container.appendChild(createRow(node, depth));
            return;
          }
          if (node.name) container.appendChild(createRow(node, depth));
          if (node.isFolder) {
            sortChildren(node).forEach(function (entry) { renderNode(entry[1], depth + 1, container); });
          }
        }

        sortChildren(rootNode).forEach(function (entry) { renderNode(entry[1], 0, treeContainer); });
      }

      /* ====================================================================
         8. TAB SWITCHING
      ==================================================================== */
      function switchTab(tabName) {
        tabPreview.classList.toggle('active', tabName === 'preview');
        tabCode.classList.toggle('active', tabName === 'code');
        document.getElementById('pane-preview').classList.toggle('active', tabName === 'preview');
        document.getElementById('pane-code').classList.toggle('active', tabName === 'code');
        if (tabName === 'preview') updatePreview();
        if (tabName === 'code') scheduleGutterUpdate();
      }

      tabPreview.addEventListener('click', function () { switchTab('preview'); });
      tabCode.addEventListener('click', function () { switchTab('code'); });

      /* ====================================================================
         9. COPY & DOWNLOAD
      ==================================================================== */
      btnCopy.addEventListener('click', function () {
        navigator.clipboard.writeText(input.value).then(function () {
          btnCopy.querySelector('span').textContent = 'Copied!';
          setTimeout(function () { btnCopy.querySelector('span').textContent = 'Copy'; }, 1500);
        }).catch(function () {
          var ta = document.createElement('textarea');
          ta.value = input.value;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          btnCopy.querySelector('span').textContent = 'Copied!';
          setTimeout(function () { btnCopy.querySelector('span').textContent = 'Copy'; }, 1500);
        });
      });

      btnDownload.addEventListener('click', function () {
        var blob = new Blob([input.value], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = currentFileName.toLowerCase().endsWith('.md') ? currentFileName : 'README.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      /* ====================================================================
         10. MARKDOWN PREVIEW (markdown-it + KaTeX + GitHub Alerts)
      ==================================================================== */
      function escH(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      /* --- KaTeX Math Rendering --- */
      function renderMath(text) {
        if (typeof katex === 'undefined') return text;
        var processed = text.replace(/\$\$([\s\S]+?)\$\$/g, function (match, math) {
          try { return '<div class="katex-display">' + katex.renderToString(math.trim(), { displayMode: true }) + '</div>'; }
          catch (e) { return '<span style="color:red">' + escH(match) + '</span>'; }
        });
        processed = processed.replace(/\$([^\$\n]+?)\$/g, function (match, math) {
          try { return katex.renderToString(math.trim(), { displayMode: false }); }
          catch (e) { return '<span style="color:red">' + escH(match) + '</span>'; }
        });
        return processed;
      }

      /* --- GitHub Alerts (5 types) --- */
      function renderAlerts(html) {

        const alertTypes = {
          'NOTE': { class: 'note', title: 'Note', icon: '<svg class="octicon octicon-info mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' },
          'TIP': { class: 'tip', title: 'Tip', icon: '<svg class="octicon octicon-light-bulb mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"></path></svg>' },
          'IMPORTANT': { class: 'important', title: 'Important', icon: '<svg class="octicon octicon-issue-opened mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>' },
          'WARNING': { class: 'warning', title: 'Warning', icon: '<svg class="octicon octicon-alert mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>' },
          'CAUTION': { class: 'caution', title: 'Caution', icon: '<svg class="octicon octicon-stop mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' }
        };

        const temp = document.createElement('div');
        temp.innerHTML = html;

        temp.querySelectorAll('blockquote').forEach(bq => {
          const p = bq.querySelector('p');
          if (!p) return;
          const m = p.innerHTML.trim().match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
          if (m) {
            const type = m[1].toUpperCase();
            const cfg = alertTypes[type];
            p.innerHTML = p.innerHTML.replace(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>)?\s*/i, '').trim();
            const alertDiv = document.createElement('div');
            alertDiv.className = `markdown-alert markdown-alert-${cfg.class}`;

            alertDiv.innerHTML = `
            <p class="markdown-alert-title">
              ${cfg.icon}
              ${cfg.title}
            </p>
            ${bq.innerHTML}
          `;
            bq.parentNode.replaceChild(alertDiv, bq);
          }
        });
        return temp.innerHTML;
      }

      /* --- Front Matter Parsing --- */
      function parseFM(text) {
        var result = {}, lines = text.split('\n'), i = 0;
        while (i < lines.length) {
          var line = lines[i], m = line.match(/^([a-zA-Z_][a-zA-Z0-9_\-]*)\s*:\s*(.*)/);
          if (!m) { i++; continue; }
          var key = m[1], valInline = m[2].trim(); i++;
          if (!valInline) {
            var block = [];
            while (i < lines.length && (lines[i] === '' || /^\s/.test(lines[i]))) { block.push(lines[i]); i++; }
            var raw2 = block.join('\n').trim(), cleaned = raw2.replace(/,(\s*[}\]])/g, '$1');
            try { result[key] = JSON.parse(cleaned); } catch (e) { result[key] = raw2; }
          } else {
            if ((valInline.startsWith('"') && valInline.endsWith('"')) || (valInline.startsWith("'") && valInline.endsWith("'"))) result[key] = valInline.slice(1, -1);
            else { try { result[key] = JSON.parse(valInline); } catch (e) { result[key] = valInline; } }
          }
        }
        return result;
      }

      function fmVal(v, depth) {
        if (depth === undefined) depth = 0;
        if (v === null || v === undefined) return '<em class="fm-null">null</em>';
        if (typeof v === 'boolean' || typeof v === 'number') return '<code>' + v + '</code>';
        if (typeof v === 'string') {
          if (/^https?:\/\//.test(v)) return '<a href="' + escH(v) + '" target="_blank" rel="nofollow noopener">' + escH(v) + '</a>';
          return escH(v);
        }
        if (Array.isArray(v)) {
          if (!v.length) return '<em class="fm-empty-arr">[]</em>';
          if (v.every(function (x) { return x && typeof x === 'object' && !Array.isArray(x); })) {
            var keys = [];
            v.forEach(function (x) { Object.keys(x).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); }); });
            return '<table><thead><tr>' + keys.map(function (k) { return '<th>' + escH(k) + '</th>'; }).join('') + '</tr></thead><tbody>' +
              v.map(function (row) { return '<tr>' + keys.map(function (k) { return '<td><div dir="auto">' + fmVal(row[k], depth + 1) + '</div></td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
          }
          return v.map(function (x) { return typeof x === 'object' ? fmVal(x, depth + 1) : '<code>' + escH(String(x)) + '</code>'; }).join(' ');
        }
        if (typeof v === 'object') {
          var entries = Object.entries(v);
          if (!entries.length) return '<em class="fm-empty-obj">{}</em>';
          if (depth === 0) return '<table><tbody>' + entries.map(function (e) { return '<tr><th>' + escH(e[0]) + '</th><td>' + fmVal(e[1], 1) + '</td></tr>'; }).join('') + '</tbody></table>';
          return '<table><thead><tr>' + entries.map(function (e) { return '<th>' + escH(e[0]) + '</th>'; }).join('') + '</tr></thead><tbody><tr>' +
            entries.map(function (e) { return '<td><div dir="auto">' + fmVal(e[1], depth + 1) + '</div></td>'; }).join('') + '</tr></tbody></table>';
        }
        return escH(String(v));
      }

      /* --- Main Preview Pipeline --- */
      function resolveRelativePath(fromDir, rel) {
        var clean = rel.replace(/^[.\/]+/, '');
        var parts = clean.split('/');
        var base = fromDir ? fromDir.split('/') : [];
        for (var i = 0; i < parts.length; i++) {
          if (parts[i] === '..') base.pop();
          else if (parts[i] !== '.') base.push(parts[i]);
        }
        return base.join('/');
      }

      function isExternalUrl(p) {
        return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p);
      }

      function resolveMediaInMarkdown(content) {
        if (!currentFilePath || openMode !== 'folder') return content;
        var dir = currentFilePath.split('/').slice(0, -1).join('/');
        content = content.replace(/(!\[[^\]]*\]\()([^)\s]+)(\))/g, function (m, pre, path, suf) {
          if (isExternalUrl(path)) return m;
          var resolved = resolveRelativePath(dir, path);
          return mediaBlobUrls[resolved] ? pre + mediaBlobUrls[resolved] + suf : m;
        });
        content = content.replace(/(<(?:img|video|audio|source)[^>]*src=["'])([^"']+)(["'][^>]*>)/gi, function (m, pre, path, suf) {
          if (isExternalUrl(path)) return m;
          var resolved = resolveRelativePath(dir, path);
          return mediaBlobUrls[resolved] ? pre + mediaBlobUrls[resolved] + suf : m;
        });
        return content;
      }

      // window.executeGithubCopy = function (buttonElement, encodedSourceText) {
      //   var rawText = decodeURIComponent(encodedSourceText);
      //   var copyIcon = buttonElement.querySelector('.js-clipboard-copy-icon');
      //   var checkIcon = buttonElement.querySelector('.js-clipboard-check-icon');

      //   navigator.clipboard.writeText(rawText).then(function () {
      //     if (copyIcon) copyIcon.classList.add('d-none');
      //     if (checkIcon) checkIcon.classList.remove('d-none');
      //     buttonElement.classList.add('copied');

      //     setTimeout(function () {
      //       if (copyIcon) copyIcon.classList.remove('d-none');
      //       if (checkIcon) checkIcon.classList.add('d-none');
      //       buttonElement.classList.remove('copied');
      //     }, 2000);
      //   }).catch(function (err) {
      //     console.error("Failed to copy source code: ", err);
      //   });
      // };

      function updatePreview() {
        if (!md) return;

        var rawContent = input.value.trim(), htmlResult = '';
        var resolvedContent = resolveMediaInMarkdown(rawContent);
        var frontMatterMatch = rawContent.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
        if (frontMatterMatch) {
          var fmText = frontMatterMatch[1], markdownBody = resolvedContent.replace(frontMatterMatch[0], '');
          var data = parseFM(fmText), entries = Object.entries(data), tableHtml = '';
          if (entries.length > 0) {
            tableHtml = '<markdown-accessiblity-table data-catalyst=""><table><tbody>' +
              entries.map(function (e) { return '<tr><th>' + escH(e[0]) + '</th><td>' + fmVal(e[1], 1) + '</td></tr>'; }).join('') + '</tbody></table></markdown-accessiblity-table>';
          }

          var rendered = md.render(markdownBody);
          if (typeof renderAlerts === 'function') {
            rendered = renderAlerts(rendered);
          }

          htmlResult = tableHtml + rendered;
        } else {

          var rendered = md.render(resolvedContent);

          if (typeof renderAlerts === 'function') {
            rendered = renderAlerts(rendered);
          }

          htmlResult = rendered;
        }

        preview.innerHTML = htmlResult;
      }

      /* ====================================================================
         11. CONTEXT MENU & CLOSE CURRENT
      ==================================================================== */
      var ctxMenu = document.getElementById('ctx-menu');
      var ctxCopyAbs = document.getElementById('ctx-copy-abs');
      var ctxCopyRel = document.getElementById('ctx-copy-rel');
      var ctxSepPath = document.getElementById('ctx-sep-path');
      var ctxSepClose = document.getElementById('ctx-sep-close');
      var ctxCloseCurrent = document.getElementById('ctx-close-current');
      var ctxCloseLabel = document.getElementById('ctx-close-label');
      var ctxTargetNode = null;

      function findNodeByPath(root, path) {
        if (!root) return null;
        if (root.path === path) return root;
        var keys = Object.keys(root.children || {});
        for (var i = 0; i < keys.length; i++) {
          var found = findNodeByPath(root.children[keys[i]], path);
          if (found) return found;
        }
        return null;
      }

      function getRelativePath(targetPath) {
        var currentPath = '';
        if (activeTreeRow && activeTreeRow.dataset && activeTreeRow.dataset.path) {
          currentPath = activeTreeRow.dataset.path;
        }
        if (!currentPath) return targetPath;
        var fromDir = currentPath.split('/').slice(0, -1);
        var toParts = targetPath.split('/');
        var common = 0;
        while (common < fromDir.length && common < toParts.length && fromDir[common] === toParts[common]) common++;
        var up = fromDir.length - common;
        var down = toParts.slice(common);
        var result = [];
        for (var i = 0; i < up; i++) result.push('..');
        return result.concat(down).join('/') || '.';
      }

      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(function () {
            fallbackCopy(text);
          });
        }
        fallbackCopy(text);
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }

      function closeCurrent() {
        Object.keys(mediaBlobUrls).forEach(function (k) { URL.revokeObjectURL(mediaBlobUrls[k]); });
        mediaBlobUrls = {};
        loadedFiles = {};
        treeRoot = null;
        activeTreeRow = null;
        openMode = 'none';
        currentFileName = 'readme.md';
        input.value = defaultData;
        updatePreview();
        scheduleGutterUpdate();
        var rows = treeContainer.querySelectorAll('.tree-row');
        for (var i = 0; i < rows.length; i++) rows[i].remove();
        treeEmpty.style.display = '';
        sidebarLabel.textContent = 'File tree';
      }

      function showCtxMenu(e) {
        e.preventDefault();
        e.stopPropagation();

        var row = e.target.closest('.tree-row');
        ctxTargetNode = null;
        if (row && row.dataset && row.dataset.path && treeRoot) {
          ctxTargetNode = findNodeByPath(treeRoot, row.dataset.path);
        }

        var hasTarget = !!ctxTargetNode;
        ctxCopyAbs.style.display = hasTarget ? '' : 'none';
        ctxCopyRel.style.display = hasTarget ? '' : 'none';
        ctxSepPath.style.display = hasTarget ? '' : 'none';

        var hasOpen = openMode !== 'none';
        ctxSepClose.style.display = hasOpen ? '' : 'none';
        ctxCloseCurrent.style.display = hasOpen ? '' : 'none';
        if (hasOpen) {
          ctxCloseLabel.textContent = openMode === 'folder' ? 'Close Current Folder' : 'Close Current File';
        }

        ctxMenu.classList.add('visible');
        var x = e.clientX, y = e.clientY;
        requestAnimationFrame(function () {
          var mw = ctxMenu.offsetWidth, mh = ctxMenu.offsetHeight;
          if (x + mw > window.innerWidth) x = window.innerWidth - mw - 4;
          if (y + mh > window.innerHeight) y = window.innerHeight - mh - 4;
          if (x < 0) x = 4;
          if (y < 0) y = 4;
          ctxMenu.style.left = x + 'px';
          ctxMenu.style.top = y + 'px';
        });
      }

      function hideCtxMenu() {
        ctxMenu.classList.remove('visible');
        ctxTargetNode = null;
      }

      sidebar.addEventListener('contextmenu', showCtxMenu);

      document.addEventListener('click', function (e) {
        if (!ctxMenu.contains(e.target)) hideCtxMenu();
        // Xác định chính xác vị trí người dùng nhấn chuột vào nút bấm
        var button = e.target.closest('.ClipboardButton');
        if (!button) return;

        // Đọc trực tiếp chuỗi văn bản an toàn lưu tại thuộc tính data của nút
        var textToCopy = button.getAttribute('data-clipboard-text');
        if (!textToCopy) return;

        // Thực hiện lệnh gọi hệ thống sao chép văn bản vào Clipboard
        navigator.clipboard.writeText(textToCopy).then(function () {
          // Tìm các thẻ icon nằm trực tiếp bên trong nút vừa nhấn
          var copyIcon = button.querySelector('.js-clipboard-copy-icon');
          var checkIcon = button.querySelector('.js-clipboard-check-icon');

          if (copyIcon && checkIcon) {
            // Thực hiện hiệu ứng chuyển đổi ẩn icon copy, hiện icon check xanh
            copyIcon.classList.add('d-none');
            checkIcon.classList.remove('d-none');

            // Tạo đồng hồ đếm ngược tự động khôi phục giao diện sau 2 giây
            setTimeout(function () {
              copyIcon.classList.remove('d-none');
              checkIcon.classList.add('d-none');
            }, 2000);
          }
        }).catch(function (err) {
          console.error('Lỗi hệ thống, không thể thực hiện sao chép: ', err);
        });
      });

      document.addEventListener('contextmenu', function (e) {
        if (!sidebar.contains(e.target)) hideCtxMenu();
      });

      ctxMenu.addEventListener('click', function (e) {
        var item = e.target.closest('.ctx-item');
        if (!item) return;
        var action = item.dataset.action;
        if (action === 'open-file') { filePicker.click(); }
        else if (action === 'open-folder') { folderPicker.click(); }
        else if (action === 'copy-abs' && ctxTargetNode) { copyToClipboard(ctxTargetNode.path); }
        else if (action === 'copy-rel' && ctxTargetNode) { copyToClipboard(getRelativePath(ctxTargetNode.path)); }
        else if (action === 'close-current') { closeCurrent(); }
        hideCtxMenu();
      });

      updatePreview();
      scheduleGutterUpdate();

    })();
  </script>
